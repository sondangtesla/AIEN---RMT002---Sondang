services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retail_postgres_data:/var/lib/postgresql/data

  nl2sql-api:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: retail_analytics
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      ANALYTICS_DB_TARGET: local
      LOCAL_POSTGRES_HOST: postgres
      LOCAL_POSTGRES_PORT: 5432
      LOCAL_POSTGRES_DB: retail_analytics
      LOCAL_POSTGRES_USER: retail
      LOCAL_POSTGRES_PASSWORD: retail
      LOCAL_DATABASE_URL: postgresql://retail:retail@postgres:5432/retail_analytics
      NL2SQL_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app

  analytics-ui:
    build: .
    environment:
      ENGINE_URL: http://nl2sql-api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    depends_on:
      - nl2sql-api
    volumes:
      - ./:/app

  # A1-A3: orkestrasi pipeline. Satu jaringan dengan postgres -> host `postgres`.
  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      # A3: hanya 2 library yang dibutuhkan kode pipeline (versi sama dengan uv.lock)
      _PIP_ADDITIONAL_REQUIREMENTS: "pg8000==1.31.5 python-dotenv==1.2.3"
      PYTHONPATH: /opt/project
      # A2: di dalam container, localhost = container itu sendiri -> pakai nama service.
      # Env ini menang atas .env (load_dotenv tidak menimpa env yang sudah ada).
      ANALYTICS_DB_TARGET: local
      LOCAL_DATABASE_URL: postgresql://retail:retail@postgres:5432/retail_analytics
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/opt/project              # kode + data/raw + dags
      - airflow_data:/opt/airflow    # metadata Airflow & password admin tetap ada setelah restart

volumes:
  retail_postgres_data:
  airflow_data:
